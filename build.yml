name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Crear proyecto
        run: |
          mkdir ZeldaTPBridge && cd ZeldaTPBridge
          mkdir -p app
          cat > app/build.gradle <<'EOF_0'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.cocoon.zeldatp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cocoon.zeldatp"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_0
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <package android:name="org.dolphinemu.dolphinemu" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <meta-data
                          android:name="android.app.shortcuts"
                          android:resource="@xml/shortcuts" />
                  </activity>
              </application>
          </manifest>
          EOF_1
          mkdir -p app/src/main/java/com/cocoon/zeldatp
          cat > app/src/main/java/com/cocoon/zeldatp/MainActivity.java <<'EOF_2'
          package com.cocoon.zeldatp;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;

          /** Lanza Twilight Princess en Dolphin con AutoStartFile. */
          public class MainActivity extends Activity {

              static final String ISO_URI =
                  "content://com.android.externalstorage.documents/tree/primary%3ACocoon%2FGAMECUBE/"
                  + "Legend of Zelda, The - Twilight Princess (Europe) (En,Fr,De,Es,It).iso";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.setComponent(new ComponentName("org.dolphinemu.dolphinemu",
                          "org.dolphinemu.dolphinemu.ui.main.MainActivity"));
                  i.putExtra("AutoStartFile", ISO_URI);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  try {
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, R.string.dolphin_missing, Toast.LENGTH_LONG).show();
                  }
                  finish();
              }
          }
          EOF_2
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF_3'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#F9D548" android:pathData="M54,30 L68,58 L40,58 Z"/>
              <path android:fillColor="#F9D548" android:pathData="M40,62 L54,62 L47,76 Z"/>
              <path android:fillColor="#F9D548" android:pathData="M54,62 L68,62 L61,76 Z"/>
          </vector>
          EOF_3
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_zelda.xml <<'EOF_4'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1B5E20" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F9D548" android:pathData="M54,24 L72,60 L36,60 Z"/>
              <path android:fillColor="#F9D548" android:pathData="M36,64 L54,64 L45,82 Z"/>
              <path android:fillColor="#F9D548" android:pathData="M54,64 L72,64 L63,82 Z"/>
          </vector>
          EOF_4
          mkdir -p app/src/main/res/mipmap-anydpi
          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF_5
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'EOF_6'
          <resources>
              <color name="icon_bg">#1B5E20</color>
          </resources>
          EOF_6
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_7'
          <resources>
              <string name="app_name">Zelda TP (Dolphin)</string>
              <string name="shortcut_short">Twilight Princess</string>
              <string name="shortcut_long">The Legend of Zelda - Twilight Princess</string>
              <string name="dolphin_missing">Dolphin no está instalado</string>
          </resources>
          EOF_7
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/shortcuts.xml <<'EOF_8'
          <?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut
                  android:shortcutId="zelda_twilight_princess"
                  android:enabled="true"
                  android:icon="@drawable/ic_zelda"
                  android:shortcutShortLabel="@string/shortcut_short"
                  android:shortcutLongLabel="@string/shortcut_long">
                  <intent
                      android:action="android.intent.action.MAIN"
                      android:targetPackage="org.dolphinemu.dolphinemu"
                      android:targetClass="org.dolphinemu.dolphinemu.ui.main.MainActivity">
                      <extra
                          android:name="AutoStartFile"
                          android:value="content://com.android.externalstorage.documents/tree/primary%3ACocoon%2FGAMECUBE/Legend of Zelda, The - Twilight Princess (Europe) (En,Fr,De,Es,It).iso" />
                  </intent>
              </shortcut>
          </shortcuts>
          EOF_8
          cat > build.gradle <<'EOF_9'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_9
          cat > gradle.properties <<'EOF_10'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_10
          cat > settings.gradle <<'EOF_11'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeldaTPBridge"
          include ':app'
          EOF_11
      - name: Compilar
        run: cd ZeldaTPBridge && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZeldaTP-APK
          path: ZeldaTPBridge/app/build/outputs/apk/debug/app-debug.apk
